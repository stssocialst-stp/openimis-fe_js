name: Build and Deploy Frontend to Production on Tag Creation
on:
  push:
    tags:
      - 'prod-frontend-v*'

jobs:
  publish-docker-prod-image:
    runs-on: ubuntu-latest
    outputs:
      fe_tag: ${{ steps.extract_tag.outputs.fe_tag }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Extract tag name
        id: extract_tag
        run: |
          TAG=${GITHUB_REF_NAME}
          echo "fe_tag=${TAG}" >> $GITHUB_ENV
          echo "fe_tag=${TAG}" >> $GITHUB_OUTPUT

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USER }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build the Kenon Frontend Docker image
        run: |
          LABEL=${{ steps.extract_tag.outputs.fe_tag }} 
          echo "Building Docker image for ${LABEL}..."
          docker build . --tag ghcr.io/stssocialst-stp/kenon-frontend:${LABEL}

      - name: Push Docker image to GHCR
        run: |
          LABEL=${{ steps.extract_tag.outputs.fe_tag }} 
          echo "Pushing Docker image for ${LABEL}..."
          docker push ghcr.io/stssocialst-stp/kenon-frontend:${LABEL}

    trigger-deploy-orchestrator:
      needs: publish-docker-prod-image
      runs-on: ubuntu-latest
      steps:
        - name: Trigger prod workflow in openimis-dist_dkr
          uses: peter-evans/repository-dispatch@v3
          with:
            token: ${{ secrets.GHCR_TOKEN }}
            repository: stssocialst-stp/openimis-dist_dkr
            event-type: deploy-kenon-prod-frontend